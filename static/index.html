<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Видеорешения · Кабинет математики</title>
<style>
:root{
  --paper:#f1ecdd;
  --panel:#f9f6ec;
  --panel-2:#ece5d2;
  --ink:#26221a;
  --muted:#6d6553;
  --faint:#a39a82;
  --line:#d9d1ba;
  --line-strong:#b5ab8e;
  --accent:#8e3b22;      /* сургуч */
  --accent-dark:#6f2c18;
  --green:#2e5d43;
  --err:#9c2b1d;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(38,34,26,.022) 0 1px,transparent 1px 3px),
    radial-gradient(1200px 600px at 80% -10%,rgba(142,59,34,.05),transparent 60%);
  font:15px/1.6 var(--serif);
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(142,59,34,.22)}
button{font:inherit;color:inherit}

.app{display:flex;flex-direction:column;height:100vh}

/* ---------- Шапка ---------- */
.masthead{flex-shrink:0;padding:14px 26px 12px;border-bottom:3px double var(--line-strong);
  display:flex;align-items:baseline;gap:18px;background:var(--panel)}
.brand{font-size:21px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .amp{color:var(--accent)}
.masthead-rule{flex:1;border-bottom:1px solid var(--line);transform:translateY(-4px)}
.masthead-meta{font:11px/1.4 var(--mono);color:var(--muted);text-transform:uppercase;
  letter-spacing:.12em;text-align:right;white-space:nowrap}

/* ---------- Каркас ---------- */
.columns{flex:1;display:flex;min-height:0}

/* ---------- Оглавление ---------- */
.toc{width:302px;flex-shrink:0;border-right:1px solid var(--line-strong);
  display:flex;flex-direction:column;background:var(--panel)}
.toc-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px}
.toc-title{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.new-chat{border:1px solid var(--line-strong);background:transparent;padding:5px 11px;
  font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  color:var(--ink);transition:all .12s}
.new-chat:hover{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chat-list{flex:1;overflow-y:auto;padding:2px 12px 14px}
.chat-row{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:9px 8px 8px;border-bottom:1px solid var(--line)}
.chat-row:hover{background:var(--panel-2)}
.chat-row.active{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
.chat-row-top{display:flex;align-items:baseline;gap:8px}
.chat-num{font:700 11px/1 var(--mono);color:var(--faint);flex-shrink:0}
.chat-row.active .chat-num{color:var(--accent)}
.chat-name{flex:1;font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-style:italic}
.chat-meta{display:flex;align-items:center;gap:6px;margin-top:3px;
  font:10.5px/1 var(--mono);color:var(--faint);letter-spacing:.05em}
.mark{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mark.pending{background:transparent;border:1.5px solid var(--accent);animation:pulse-mark 1.1s infinite alternate}
.mark.ready{background:var(--green)}
.mark.err{background:var(--err)}
@keyframes pulse-mark{to{background:var(--accent)}}
.toc-foot{border-top:1px solid var(--line);padding:10px 18px;
  font:10.5px/1.6 var(--mono);color:var(--faint)}

/* ---------- Лист ---------- */
.sheet{flex:1;display:flex;flex-direction:column;min-width:0}
.thread-wrap{flex:1;overflow-y:auto;padding:28px 30px 16px}
.thread{max-width:820px;margin:0 auto}

.date-line{display:flex;align-items:center;gap:12px;margin:0 0 24px;color:var(--faint);
  font:10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}
.date-line::before,.date-line::after{content:"";flex:1;border-top:1px solid var(--line)}

/* задача от ученика */
.task{margin:0 0 26px;display:flex;justify-content:flex-end}
.task-card{max-width:76%;border:1px solid var(--line-strong);background:var(--panel-2);
  padding:12px 16px 13px;position:relative;box-shadow:3px 3px 0 rgba(38,34,26,.08)}
.task-label{position:absolute;top:-9px;left:10px;background:var(--paper);
  padding:0 7px;font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.task-text{white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}

/* ответ мастера */
.work{margin:0 0 30px}

.status-line{font:13px/1.7 var(--mono);color:var(--muted)}
.status-line .prompt{color:var(--accent)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.note-err{color:var(--err);font-style:italic}

/* ---------- Гравюра (видео) ---------- */
.figure{border:1px solid var(--ink);background:var(--panel);box-shadow:5px 5px 0 rgba(38,34,26,.12)}
.figure-caption{display:flex;align-items:baseline;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.figure-no{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.figure-title{font-style:italic;font-size:14.5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.figure iframe{display:block;width:100%;height:600px;border:0;background:#fff}
.figure video{display:block;width:100%;height:600px;border:0;background:#0e0d0b}

/* плеер: заставка + кнопка */
.player{position:relative}
.play-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid var(--ink);
  background:var(--panel);padding:13px 22px 13px 16px;
  font:700 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
  box-shadow:4px 4px 0 rgba(38,34,26,.8);transition:all .12s}
.play-btn:hover{background:var(--accent);border-color:var(--accent-dark);color:#fdfaf2;transform:translate(-50%,-50%) scale(1.04)}
.play-tri{width:0;height:0;border-left:16px solid currentColor;border-top:10px solid transparent;border-bottom:10px solid transparent;display:inline-block}
.play-note{position:absolute;left:10px;bottom:10px;background:rgba(38,34,26,.82);color:#f5f0e2;
  font:10.5px/1 var(--mono);letter-spacing:.08em;padding:6px 9px;text-transform:uppercase}
.figure-actions{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}

.btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;text-decoration:none;
  font:700 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  padding:8px 13px;border:1.5px solid var(--ink);color:var(--ink);background:transparent;
  box-shadow:2.5px 2.5px 0 rgba(38,34,26,.85);transition:all .1s}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(38,34,26,.85)}
.btn:active{transform:translate(2.5px,2.5px);box-shadow:none}
.btn-primary{background:var(--accent);border-color:var(--accent-dark);color:#fdfaf2;box-shadow:2.5px 2.5px 0 rgba(111,44,24,.55)}
.btn-primary:hover{box-shadow:1px 1px 0 rgba(111,44,24,.55)}
.btn-ghost{border-color:var(--line-strong);box-shadow:none;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink);transform:none}

/* пустой лист */
.blank{padding:34px 0 10px;text-align:center;color:var(--muted)}
.blank-rule{font-size:34px;color:var(--faint);letter-spacing:.4em;margin-bottom:10px}
.blank h2{font-size:24px;font-weight:400;font-style:italic;margin:0 0 6px}
.blank p{margin:0;font-size:14.5px}
.samples{margin:26px auto 0;max-width:520px;text-align:left;border:1px solid var(--line-strong);background:var(--panel)}
.samples-head{padding:8px 14px;border-bottom:1px solid var(--line);
  font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sample{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;font:inherit;font-size:14.5px}
.sample:last-child{border-bottom:0}
.sample:hover{background:var(--panel-2)}
.sample .no{font:700 11px/1.4 var(--mono);color:var(--accent);flex-shrink:0}

/* ---------- Строка для решения ---------- */
.composer{flex-shrink:0;border-top:1px solid var(--line-strong);background:var(--panel);padding:14px 30px 12px}
.composer-inner{max-width:820px;margin:0 auto}
.composer-label{font:700 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.composer-box{display:flex;gap:12px;align-items:flex-end;
  background:
    repeating-linear-gradient(0deg,transparent 0 27px,var(--line) 27px 28px),
    linear-gradient(90deg,transparent 0,transparent 34px,var(--accent) 34px,rgba(142,59,34,.45) 35px,transparent 36px);
  background-color:#fffdf6;border:1px solid var(--line-strong);
  padding:2px 10px 6px 46px;transition:border-color .15s}
.composer-box:focus-within{border-color:var(--ink)}
textarea{flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--ink);
  font:15.5px/28px var(--serif);height:56px;max-height:140px;padding:0}
textarea::placeholder{color:var(--faint);font-style:italic}
.solve{flex-shrink:0;margin-bottom:3px;border:1.5px solid var(--accent-dark);background:var(--accent);
  color:#fdfaf2;font:700 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  padding:10px 16px;cursor:pointer;box-shadow:2.5px 2.5px 0 rgba(111,44,24,.55);transition:all .1s}
.solve:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(111,44,24,.55)}
.solve:disabled{opacity:.45;cursor:default;transform:none}
.composer-hint{margin-top:7px;text-align:center;font:10.5px/1 var(--mono);color:var(--faint);letter-spacing:.06em}

/* скроллбары */
.thread-wrap::-webkit-scrollbar,.chat-list::-webkit-scrollbar{width:9px}
.thread-wrap::-webkit-scrollbar-thumb,.chat-list::-webkit-scrollbar-thumb{background:var(--line-strong);border:2px solid var(--panel);border-radius:6px}
.thread-wrap::-webkit-scrollbar-track,.chat-list::-webkit-scrollbar-track{background:transparent}

@media(max-width:900px){
  .toc{display:none}
  .thread-wrap{padding:18px 16px 10px}
  .composer{padding:12px 16px 10px}
  .figure iframe{height:480px}
}
</style>
</head>
<body>
<div class="app">

<header class="masthead">
  <div class="brand">Видеорешения <span class="amp">&amp;</span> Разборы</div>
  <div class="masthead-rule"></div>
  <div class="masthead-meta">ЕГЭ · профильная математика<br><span id="today"></span></div>
</header>

<div class="columns">

<aside class="toc">
  <div class="toc-head">
    <span class="toc-title">Оглавление</span>
    <button class="new-chat" id="newChat">+ Лист</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="toc-foot">Каждая задача получает<br>видеоразбор с голосом.</div>
</aside>

<main class="sheet">
  <div class="thread-wrap" id="scroller">
    <div class="thread" id="thread"></div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <div class="composer-label">Условие задачи</div>
      <div class="composer-box">
        <textarea id="input" placeholder="Перепишите условие — хотя бы одним предложением…"></textarea>
        <button class="solve" id="send">Решить →</button>
      </div>
      <div class="composer-hint">Enter — отправить · Shift+Enter — перенос строки</div>
    </div>
  </div>
</main>

</div>
</div>

<script>
const thread=document.getElementById('thread'),input=document.getElementById('input'),
      send=document.getElementById('send'),chatList=document.getElementById('chatList'),
      scroller=document.getElementById('scroller');

document.getElementById('today').textContent=new Date().toLocaleDateString('ru-RU',
  {day:'numeric',month:'long',year:'numeric'});

let currentChat=null,generating=false,userCounter=0;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function scrollBottom(){scroller.scrollTop=scroller.scrollHeight}
function setStatus(slot,html){slot.innerHTML=`<div class="status-line"><span class="prompt">›</span> ${html}<span class="cursor"></span></div>`;scrollBottom()}

function addTask(text){
  userCounter++;
  const d=document.createElement('div');d.className='task';
  d.innerHTML=`<div class="task-card"><span class="task-label">Задача №${userCounter}</span><div class="task-text">${esc(text)}</div></div>`;
  thread.appendChild(d);scrollBottom();
}
function addWork(){const d=document.createElement('div');d.className='work';thread.appendChild(d);return d}

function figureHTML(v){
  const ready=v.status==='ready';
  const media=ready?`
    <div class="player" id="pl-${v.id}">
      <iframe src="/api/videos/${v.id}/html?still=1" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>
      <button class="play-btn" data-vid="${v.id}"><span class="play-tri"></span>Смотреть · с озвучкой</button>
      <span class="play-note">нажмите, чтобы включить воспроизведение</span>
    </div>`
  :`<iframe src="/api/videos/${v.id}/html" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>`;
  return `
  <div class="figure">
    <div class="figure-caption"><span class="figure-no">Рис. ${v.seq}</span><span class="figure-title">${esc(v.title||'Решение задачи')}</span></div>
    ${media}
    <div class="figure-actions">
      <a class="btn btn-primary" href="/api/videos/${v.id}/video" download>↓ Скачать видео (MP4)</a>
      <a class="btn" href="/api/videos/${v.id}/mp3" download>↓ Только звук (MP3)</a>
      <a class="btn btn-ghost" href="/api/videos/${v.id}/html" target="_blank">Открыть доску ↗</a>
    </div>
  </div>`;
}

let figSeq=0;
function renderFigure(v,slot){
  v.seq=++figSeq;
  slot.innerHTML=figureHTML(v);
  scrollBottom();
}

/* клик по «Смотреть» -> видео с озвучкой прямо в чате */
thread.addEventListener('click',e=>{
  const b=e.target.closest('.play-btn');
  if(!b)return;
  const pl=document.getElementById('pl-'+b.dataset.vid);
  if(!pl)return;
  pl.innerHTML='<video controls autoplay playsinline preload="auto" src="/api/videos/'+b.dataset.vid+'/video"></video>';
  scrollBottom();
});

async function poll(vid,slot){
  const phases={'pending':'решаю задачу и верстаю доску','rendering':'готовлю видеоряд'};
  for(let i=0;i<600;i++){
    await new Promise(r=>setTimeout(r,2000));
    let v;try{v=await (await fetch(`/api/videos/${vid}`)).json()}catch(e){continue}
    if(v.status==='ready')return v;
    if(v.status==='error'){
      slot.innerHTML=`<div class="status-line"><span class="note-err">✗ не вышло: ${esc(v.error||'неизвестная ошибка')}.</span></div>`;
      return null;
    }
    setStatus(slot,esc(v.stage||phases[v.status]||'работаю')+'…');
  }
  setStatus(slot,'<span class="note-err">превышено время ожидания</span>');
  return null;
}

async function generate(){
  const problem=input.value.trim();
  if(!problem||generating)return;
  if(!currentChat){
    const c=await (await fetch('/api/chats',{method:'POST'})).json();
    currentChat=c.id;thread.innerHTML='';userCounter=0;
  }
  input.value='';input.style.height='56px';send.disabled=true;generating=true;
  addTask(problem);
  const slot=addWork();
  setStatus(slot,'принял задачу, разбираюсь…');
  try{
    const r=await (await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({problem,chat_id:currentChat})})).json();
    currentChat=r.chat_id;
    const v=await poll(r.id,slot);
    if(v)renderFigure(v,slot);
    loadChats();
  }catch(e){
    slot.innerHTML=`<div class="status-line"><span class="note-err">✗ ${esc(e.message)}</span></div>`;
  }
  send.disabled=false;generating=false;input.focus();
}

/* ---------- оглавление ---------- */

async function loadChats(){
  try{
    const list=await (await fetch('/api/chats')).json();
    chatList.innerHTML='';
    list.forEach((c,idx)=>{
      const b=document.createElement('button');
      b.className='chat-row'+(c.id===currentChat?' active':'');
      const num=String(list.length-idx).padStart(2,'0');
      const mark=c.pending?'<span class="mark pending"></span>'
                :`<span class="mark ready"></span>${c.n_videos}`;
      b.innerHTML=`<div class="chat-row-top"><span class="chat-num">${num}.</span><span class="chat-name">${esc(c.title)}</span></div>
                   <div class="chat-meta">${c.pending?'<span class="mark pending"></span>пишется':mark+' · '+(c.created||'').slice(11,16)}</div>`;
      b.onclick=()=>openChat(c.id);
      chatList.appendChild(b);
    });
  }catch(e){}
}

const SAMPLES=[
  'В треугольнике ABC биссектриса BM делит сторону AC в отношении 3:5, считая от вершины A. Найдите AB, если BC = 16.',
  'Решите уравнение √(x+7) = x − 5. Если корней несколько, укажите больший.',
  'Первый насос наполняет бак на 6 часов быстрее второго. Работая вместе, они наполняют бак за 4 часа. За сколько часов второй насос наполнит бак один?'
];

function showBlank(){
  thread.innerHTML=`
  <div class="blank">
    <div class="blank-rule">⁂</div>
    <h2>Чистый лист</h2>
    <p>Напишите условие — мастер разберёт задачу пошагово,<br>у классной доски и голосом.</p>
    <div class="samples">
      <div class="samples-head">Можно начать с примера</div>
      ${SAMPLES.map((s,i)=>`<button class="sample" data-i="${i}"><span class="no">${i+1}.</span><span>${esc(s)}</span></button>`).join('')}
    </div>
  </div>`;
  thread.querySelectorAll('.sample').forEach(b=>b.onclick=()=>{
    input.value=SAMPLES[+b.dataset.i];input.focus();input.dispatchEvent(new Event('input'));
  });
}

async function openChat(id){
  currentChat=id;userCounter=0;
  thread.innerHTML='<div class="date-line">лист восстановлен</div>';
  try{
    const c=await (await fetch(`/api/chats/${id}`)).json();
    let hasContent=false;
    for(const item of c.items){
      hasContent=true;
      if(item.type==='user'){addTask(item.text)}
      else if(item.type==='video'){
        const slot=addWork();
        let v=null;try{v=await (await fetch(`/api/videos/${item.video_id}`)).json()}catch(e){}
        if(v&&v.status==='ready'){renderFigure(v,slot)}
        else if(v&&v.status==='error'){slot.innerHTML='<div class="status-line"><span class="note-err">✗ генерация не удалась.</span></div>'}
        else{setStatus(slot,'дописываем решение…');poll(item.video_id,slot).then(ready=>{if(ready)renderFigure(ready,slot)});loadChats()}
      }
    }
    if(!hasContent)showBlank();
    loadChats();
  }catch(e){showBlank()}
}

document.getElementById('newChat').onclick=async()=>{
  const c=await (await fetch('/api/chats',{method:'POST'})).json();
  currentChat=c.id;userCounter=0;
  thread.innerHTML='';showBlank();loadChats();input.focus();
};

send.onclick=generate;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();generate()}});
input.addEventListener('input',()=>{
  input.style.height='56px';
  input.style.height=Math.min(140,input.scrollHeight)+'px';
});

(async function init(){
  const list=await (await fetch('/api/chats')).json();
  if(list.length)openChat(list[0].id);
  else{showBlank()}
})();
</script>
</body>
</html>
